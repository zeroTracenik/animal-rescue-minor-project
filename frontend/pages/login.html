<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Animal Rescue Connect</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Main Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="brand-badge">
          <i class="bi bi-shield-heart-fill"></i>
        </div>
        <div>
          <span class="brand-font fw-bold text-dark fs-5">Animal Rescue Connect</span>
        </div>
      </a>

      <div class="ms-auto">
        <a href="/" class="btn btn-sm btn-outline-custom"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
      </div>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <!-- Login Card -->
        <div class="card arc-card p-4 p-md-5 border-0 shadow-lg">
          <div class="text-center mb-4">
            <div class="brand-badge mx-auto mb-3" style="width:54px;height:54px;font-size:1.6rem;">
              <i class="bi bi-person-fill-lock"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to manage rescue cases, dispatch volunteers, or review triage queues</p>
          </div>

          <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@domain.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
              Sign In
            </button>
          </form>

          <div class="text-center small text-muted">
            Don't have an account? <a href="/pages/register.html" class="fw-semibold text-primary">Register Here</a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
